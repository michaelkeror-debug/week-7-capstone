services:
  triage-api:
    image: triage-api:1.0.0
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://127.0.0.1:8088/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-local-dev-key}
      COST_CENTER: clinical-ai
      SERVICE_VERSION: "1.0.0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    labels:
      afyaplus.service: triage-api
      afyaplus.version: "1.0.0"
      afyaplus.cost-center: clinical-ai